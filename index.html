<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruit Desk</title>
  <meta name="description" content="글로벌 유저 인터뷰 리크루팅·스케줄링 웹 서비스">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="./index.html">Recruit<span>Desk</span></a>
      <nav class="header-nav">
        <a href="#studies" data-i18n="navStudies">리서치 목록</a>
        <button id="langBtn" class="lang-btn" type="button" data-i18n="langBtn">English</button>
      </nav>
    </div>
  </header>

  <main>
    <!-- 소개 영역 -->
    <section class="hero">
      <div class="container hero-inner">
        <div class="hero-text">
          <p class="eyebrow" data-i18n="heroEyebrow">Global UX Research</p>
          <h1 class="hero-title" data-i18n="heroTitle"></h1>
          <p class="hero-desc" data-i18n="heroDesc"></p>
          <a class="btn btn-primary" href="#studies" data-i18n="heroCta">참여 가능한 리서치 보기</a>
        </div>

        <!-- 세계 시계: 리서치 국가의 현재 시각 (JS 로 생성, 30초마다 갱신) -->
        <div class="clock-card">
          <p class="clock-title" data-i18n="clockTitle">지금 리서치 국가는 몇 시?</p>
          <ul id="clocks" class="clock-list"></ul>
        </div>
      </div>
    </section>

    <!-- 전 세계 리서치 현황: 점 세계지도 + 지표 + 차트 (js/insights.js) -->
    <section id="global" class="global">
      <div class="container">
        <h2 class="section-title" data-i18n="globalTitle">전 세계 리서치 현황</h2>
        <p class="section-desc" data-i18n="globalDesc"></p>

        <div class="map-card">
          <svg id="worldMap" class="world-map" role="img" aria-labelledby="mapAria"></svg>
          <p id="mapAria" class="sr-only" data-i18n="mapAria"></p>
          <div id="mapTip" class="map-tip" hidden></div>
          <ul class="map-legend">
            <li><i class="ml ml-hub"></i><span data-i18n="mapLegendHub"></span></li>
            <li><i class="ml ml-open"></i><span data-i18n="mapLegendOpen"></span></li>
            <li><i class="ml ml-closed"></i><span data-i18n="mapLegendClosed"></span></li>
          </ul>
        </div>

        <div id="kpis" class="kpi-row"></div>

        <div class="chart-row">
          <figure class="chart-card">
            <figcaption>
              <h3 data-i18n="chartQuotaTitle">리서치별 모집 현황</h3>
              <p data-i18n="chartQuotaDesc"></p>
            </figcaption>
            <div class="chart-box"><canvas id="quotaChart"></canvas></div>
            <div id="quotaTable" class="chart-table"></div>
          </figure>
          <figure class="chart-card">
            <figcaption>
              <h3 data-i18n="chartOverlapTitle">서울 근무시간과 겹치는 현지 활동 시간</h3>
              <p data-i18n="chartOverlapDesc"></p>
            </figcaption>
            <div class="chart-box"><canvas id="overlapChart"></canvas></div>
            <div id="overlapTable" class="chart-table"></div>
          </figure>
        </div>
      </div>
    </section>

    <!-- 참여 방법 3단계 -->
    <section class="steps">
      <div class="container">
        <h2 class="section-title" data-i18n="stepsTitle">참여 방법</h2>
        <ol class="step-list">
          <li class="step">
            <span class="step-num">1</span>
            <h3 data-i18n="step1T"></h3>
            <p data-i18n="step1D"></p>
          </li>
          <li class="step">
            <span class="step-num">2</span>
            <h3 data-i18n="step2T"></h3>
            <p data-i18n="step2D"></p>
          </li>
          <li class="step">
            <span class="step-num">3</span>
            <h3 data-i18n="step3T"></h3>
            <p data-i18n="step3D"></p>
          </li>
        </ol>
      </div>
    </section>

    <!-- 리서치 목록 (JS 로 생성) -->
    <section id="studies" class="studies">
      <div class="container">
        <div class="list-head">
          <h2 class="section-title">
            <span data-i18n="listTitle">모집 중인 리서치</span>
            <span id="studyCount" class="count"></span>
          </h2>
          <div id="filterBar" class="filter-bar" role="group" aria-label="country filter"></div>
        </div>
        <div id="studyGrid" class="study-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container" data-i18n="footer">Recruit Desk</div>
  </footer>

  <script src="./js/i18n.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/worldmap-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="./js/main.js"></script>
  <script src="./js/insights.js"></script>
</body>
</html>
