<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruit Desk · 인터뷰 예약</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/study.css">
  <link rel="stylesheet" href="./css/booking.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="./index.html">Recruit<span>Desk</span></a>
      <nav class="header-nav">
        <a href="./index.html#studies" data-i18n="navStudies">리서치 목록</a>
        <button id="langBtn" class="lang-btn" type="button" data-i18n="langBtn">English</button>
      </nav>
    </div>
  </header>

  <main class="container study-page">
    <a id="backLink" class="back-link" href="./index.html" data-i18n="backToScreener">← 설문으로</a>
    <section id="studyHead" class="study-head"></section>
    <div id="stepper"></div>

    <!-- 예약 전: 시간대 + 날짜 + 타임라인 + 시간 선택 / 오른쪽 선택 확인 -->
    <div id="bookingArea" class="booking-layout">
      <section class="panel book-panel">
        <h2 class="panel-title" data-i18n="bookTitle">인터뷰 시간 예약</h2>
        <p class="panel-desc" data-i18n="bookDesc"></p>

        <!-- 표시 기준 시간대 -->
        <div class="tz-bar">
          <span class="tz-ico" aria-hidden="true">🌏</span>
          <div class="tz-text">
            <small data-i18n="tzMine">표시 기준 시간대</small>
            <b id="tzName"></b>
          </div>
          <span id="tzNow" class="tz-now"></span>
          <label class="tz-change">
            <span data-i18n="tzChangeShort">변경</span>
            <select id="tzSelect" data-i18n-aria="tzChange"></select>
          </label>
        </div>

        <div id="dayTabs" class="day-tabs" role="tablist"></div>

        <!-- 24시간 타임라인 (JS 로 생성) -->
        <div id="timeline" class="timeline"></div>

        <div class="slot-head">
          <h3 class="sub-title" data-i18n="slotsTitle">예약 가능한 시간</h3>
          <label id="takenToggle" class="switch">
            <input type="checkbox" id="showTaken">
            <span class="switch-ui" aria-hidden="true"></span>
            <span id="takenLabel"></span>
          </label>
        </div>
        <div id="slotList" class="slot-list"></div>
      </section>

      <aside id="confirmBox" class="panel confirm-panel" aria-live="polite"></aside>
    </div>

    <!-- 예약 후: 완료 화면 -->
    <section id="doneBox" class="panel done-panel" hidden></section>
  </main>

  <!-- 모바일: 시간을 고르면 화면 아래에 고정되는 예약 바 -->
  <div id="mobileBar" class="mobile-bar" hidden></div>

  <footer class="site-footer">
    <div class="container" data-i18n="footer">Recruit Desk</div>
  </footer>

  <script src="./js/i18n.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/booking.js"></script>
</body>
</html>
